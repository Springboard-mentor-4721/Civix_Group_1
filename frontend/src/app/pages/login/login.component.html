<section class="auth-layout">
  <div class="auth-intro"><p class="eyebrow">Welcome back</p><h1>Your civic account, ready when you are.</h1><p>Sign in to see your Civix identity and continue where you left off.</p></div>
  <form class="form-panel" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <div class="form-heading"><span>Account access</span><h2>Sign in</h2></div>
    @if (serverMessage) { <div class="error-summary" role="alert">{{ serverMessage }}</div> }
    <label>Email <input type="email" formControlName="email" autocomplete="email" placeholder="you@example.com" />
      @if (form.controls.email.touched && form.controls.email.invalid) { <small>Enter a valid email address.</small> }
      @if (fieldErrors['email']) { <small>{{ fieldErrors['email'] }}</small> }
    </label>
    <label>Password <input type="password" formControlName="password" autocomplete="current-password" placeholder="Your password" />
      @if (form.controls.password.touched && form.controls.password.hasError('required')) { <small>Password is required.</small> }
      @if (fieldErrors['password']) { <small>{{ fieldErrors['password'] }}</small> }
    </label>
    <button class="submit-button" type="submit" [disabled]="loading">{{ loading ? 'Signing in...' : 'Sign in' }}</button>
    <p class="switch-link">New to Civix? <a routerLink="/register">Create an account</a></p>
  </form>
</section>
